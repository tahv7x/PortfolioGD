<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
  <title id="title">Astra Objects abstract campaign</title><desc id="desc">Purple sculptural rings floating over a dark grid.</desc>
  <defs><radialGradient id="bg" cx="55%" cy="30%" r="80%"><stop stop-color="#402a7d"/><stop offset="1" stop-color="#09080d"/></radialGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ceff"/><stop offset=".45" stop-color="#7954ff"/><stop offset="1" stop-color="#201148"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="40"/></filter></defs>
  <rect width="1200" height="1400" fill="url(#bg)"/><g stroke="#fff" stroke-opacity=".08"><path d="M0 200h1200M0 400h1200M0 600h1200M0 800h1200M0 1000h1200M0 1200h1200"/><path d="M200 0v1400M400 0v1400M600 0v1400M800 0v1400M1000 0v1400"/></g>
  <circle cx="780" cy="680" r="310" fill="#8c6cff" opacity=".22" filter="url(#blur)"/><g transform="rotate(-17 620 690)"><circle cx="620" cy="690" r="310" fill="none" stroke="url(#ring)" stroke-width="128"/><circle cx="620" cy="690" r="175" fill="#09080d"/><ellipse cx="620" cy="920" rx="360" ry="80" fill="#000" opacity=".45" filter="url(#blur)"/></g>
  <text x="72" y="105" fill="#fff" font-family="Arial" font-size="27" font-weight="700" letter-spacing="8">ASTRA® OBJECTS</text><text x="72" y="1280" fill="#fff" font-family="Arial" font-size="112" font-weight="800" letter-spacing="-7">NEW FORMS</text><text x="78" y="1330" fill="#bdb3de" font-family="Arial" font-size="20" letter-spacing="5">CAMPAIGN / 2026 / LONDON</text>
</svg>
